{% extends 'base.html' %}

{% block title %}Adicionar Evento{% endblock %}
{% block page_title %}Adicionar Evento{% endblock %}
{% block breadcrumb %}Adicionar Evento{% endblock %}

{% block content %}

<h3 class="mb-4">{{ 'Editar Evento' if evento else 'Adicionar Evento' }}</h3>

<form method="post" action="{{ url_for('evento.evento_editar', id=evento.id) if evento else url_for('evento.evento_adicionar') }}">
  <div class="form-group">
    <label for="nome">Nome do Evento</label>
    <input type="text" id="nome" name="nome" class="form-control" value="{{ evento.nome if evento else '' }}" required>
  </div>

  <div class="form-group">
    <label for="data">Data</label>
    <input type="date" id="data" name="data" class="form-control" value="{{ evento.data.strftime('%Y-%m-%d') if evento else '' }}" required>
  </div>

  <div class="form-group">
    <label for="hora">Hora</label>
    <input type="time" id="hora" name="hora" class="form-control" value="{{ evento.hora.strftime('%H:%M') if evento else '' }}" required>
  </div>

  <div class="form-group">
    <label for="estado">Estado</label>
    <select id="estado" name="estado" class="form-control" required>
      <option value="" disabled selected>Selecione o estado</option>
    </select>
  </div>

  <div class="form-group">
    <label for="cidade">Cidade</label>
    <select id="cidade" name="cidade" class="form-control" required>
      <option value="" disabled selected>Selecione a cidade</option>
    </select>
  </div>
  
  <div class="form-group">
    <label for="endereco">Endereço</label>
    <input type="text" id="endereco" name="endereco" class="form-control" value="{{ evento.endereco if evento else '' }}" required>
  </div>

  <div class="form-group">
    <label for="email_organizador">Email do Organizador</label>
    <input type="email" id="email_organizador" name="email_organizador" class="form-control" value="{{ evento.email_organizador if evento else '' }}" required>
  </div>

  <div class="row mb-3">
    <label for="descricao" class="col-sm-2 col-form-label">Descrição do Evento</label>
    <div class="col-sm-10">
      <textarea class="form-control" id="descricao" name="descricao" rows="5"></textarea>
    </div>
  </div>

  <button type="submit" class="btn btn-primary">{{ 'Atualizar' if evento else 'Adicionar' }}</button>
  <a href="{{ url_for('evento.evento') }}" class="btn btn-secondary">Cancelar</a>
</form>

<script src="https://cdn.tiny.cloud/1/plivwssgt851c62cf184w2wq9rgqa4qre7w3o460thu24obw/tinymce/6/tinymce.min.js" referrerpolicy="origin"></script>
<script>
    tinymce.init({
        selector: '#descricao',
        plugins: 'autolink lists link image charmap preview',
        toolbar: 'undo redo | formatselect | bold italic backcolor | alignleft aligncenter alignright alignjustify | bullist numlist outdent indent | removeformat | help',
        menubar: false,
        setup: function (editor) {
            editor.on('change', function () {
                editor.save();  // Salva o conteúdo no <textarea>
            });
        }
    });

    // Função para validar o conteúdo do TinyMCE antes do envio
    document.querySelector('form').addEventListener('submit', function (e) {
        const content = tinymce.get('descricao').getContent();
    });
</script>

<script>
  // Função para carregar estados
  async function carregarEstados() {
    const response = await fetch("https://servicodados.ibge.gov.br/api/v1/localidades/estados");
    const estados = await response.json();
    const estadoSelect = document.getElementById("estado");

    estados.sort((a, b) => a.nome.localeCompare(b.nome)); // Ordenar estados por nome
    estados.forEach(estado => {
      const option = document.createElement("option");
      option.value = estado.sigla; // Sigla do estado
      option.textContent = estado.nome; // Nome do estado
      estadoSelect.appendChild(option);
    });
  }

  // Função para carregar cidades com base no estado selecionado
  async function carregarCidades(estadoSigla) {
    const response = await fetch(`https://servicodados.ibge.gov.br/api/v1/localidades/estados/${estadoSigla}/municipios`);
    const cidades = await response.json();
    const cidadeSelect = document.getElementById("cidade");

    cidadeSelect.innerHTML = '<option value="" disabled selected>Selecione a cidade</option>';
    cidades.sort((a, b) => a.nome.localeCompare(b.nome)); // Ordenar cidades por nome
    cidades.forEach(cidade => {
      const option = document.createElement("option");
      option.value = cidade.nome; // Nome da cidade
      option.textContent = cidade.nome;
      cidadeSelect.appendChild(option);
    });
  }

  // Eventos para carregar estados e cidades
  document.addEventListener("DOMContentLoaded", carregarEstados);
  document.getElementById("estado").addEventListener("change", (e) => {
    carregarCidades(e.target.value);
  });
</script>
{% endblock %}
