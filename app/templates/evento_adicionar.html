{% extends 'base.html' %}

{% block title %}Adicionar Evento{% endblock %}
{% block page_title %}Adicionar Evento{% endblock %}
{% block breadcrumb %}Adicionar Evento{% endblock %}

{% block content %}
<div class="container">
  <h3 class="mb-4">{{ 'Editar Evento' if evento else 'Adicionar Evento' }}</h3>
  
  <form method="post" action="{{ url_for('evento.evento_editar', id=evento.id) if evento else url_for('evento.evento_adicionar') }}">
    <div class="form-group">
      <label for="nome">Nome do Evento</label>
      <input type="text" id="nome" name="nome" class="form-control" value="{{ evento.nome if evento else '' }}" required>
    </div>
    <div class="form-group">
      <label for="data">Data</label>
      <input type="date" id="data" name="data" class="form-control" value="{{ evento.data.strftime('%Y-%m-%d') if evento else '' }}" required>
    </div>
    <div class="form-group">
      <label for="hora">Hora</label>
      <input type="time" id="hora" name="hora" class="form-control" value="{{ evento.hora.strftime('%H:%M') if evento else '' }}" required>
    </div>
    <div class="form-group">
      <label for="endereco">Endereço</label>
      <input type="text" id="endereco" name="endereco" class="form-control" value="{{ evento.endereco if evento else '' }}" required>
    </div>
    <div class="form-group">
      <label for="email_organizador">Email do Organizador</label>
      <input type="email" id="email_organizador" name="email_organizador" class="form-control" value="{{ evento.email_organizador if evento else '' }}" required>
    </div>
    <button type="submit" class="btn btn-primary">{{ 'Atualizar' if evento else 'Adicionar' }}</button>
    <a href="{{ url_for('evento.evento') }}" class="btn btn-secondary">Cancelar</a>
  </form>
</div>
{% endblock %}
