{% extends 'base_frontend.html' %}

{% block title %}Homepage - Transparência CODAP{% endblock %}

{% block content %}
<div class="col-12 col-xxl-6">
    <div class="mb-8">
        <h5 class="text-body-tertiary fw-semibold">Você está na</h5>
        <h2 class="mb-2">Companhia mais transparente do mundo</h2>
    </div>
    <hr class="bg-body-secondary mb-6 mt-4" />
    <div class="row flex-between-center mb-4 g-3">
        <div class="col-auto">
            <h3>Resumo Financeiro</h3>
            <p class="text-body-tertiary lh-sm mb-0">Resumo do Extrato Financeiro neste ano</p>
        </div>
    </div>
    <div id="grafico-pie" style="width: 100%; height: 450px;"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts/dist/echarts.min.js"></script>
<script>
    // Dados passados da rota
    const dadosGrafico = JSON.parse('{{ dados_grafico | tojson | safe }}');

    // Função para formatar valores monetários no formato brasileiro
    const formatarValor = valor => {
        return new Intl.NumberFormat('pt-BR', {
            style: 'currency',
            currency: 'BRL'
        }).format(valor);
    };

    // Inicializar o gráfico
    const graficoPie = echarts.init(document.getElementById('grafico-pie'));

    // Configuração do gráfico
    const opcoesGrafico = {
        tooltip: {
            trigger: 'item',
            formatter: params => `${params.seriesName} <br/>${params.name}: ${formatarValor(params.value)} (${params.percent}%)`,
            position: function (point, params, dom, rect, size) {
                // Garantir que a tooltip não fique fora da tela
                let x = point[0];
                let y = point[1];

                // Ajustar a posição horizontal se necessário
                if (x + dom.offsetWidth > size.viewSize[0]) {
                    x = size.viewSize[0] - dom.offsetWidth;
                }

                // Ajustar a posição vertical se necessário
                if (y + dom.offsetHeight > size.viewSize[1]) {
                    y = size.viewSize[1] - dom.offsetHeight;
                }

                return [x, y];
            }
        },
        legend: {
            left: 'left',
            textStyle: {
                color: '#666'
            }
        },
        series: [
            {
                name: 'Resumo Financeiro',
                type: 'pie',
                radius: '90%',
                data: dadosGrafico,
                emphasis: {
                    itemStyle: {
                        shadowBlur: 10,
                        shadowOffsetX: 0,
                        shadowColor: 'rgba(0, 0, 0, 0.5)'
                    }
                }
            }
        ]
    };

    // Aplicar as opções no gráfico
    graficoPie.setOption(opcoesGrafico);
    window.addEventListener("resize", function () {
        graficoPie.resize();
    });
</script>

<style>
    #grafico-pie {
        width: 100%;
        max-width: 600px;  /* Limita o tamanho máximo */
        height: 450px;
    }
</style>

{% endblock %}
