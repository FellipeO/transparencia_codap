{% extends 'base.html' %}

{% block title %}Adicionar Novo Usuário{% endblock %}
{% block page_title %}Adicionar Usuário{% endblock %}
{% block breadcrumb %}Adicionar Usuário{% endblock %}

{% block content %}
<form action="{{ url_for('main.adicionar_usuario') }}" method="post">
  <div class="row mb-3">
    <label for="inputEmail" class="col-sm-2 col-form-label">Email</label>
    <div class="col-sm-10">
      <input type="email" class="form-control" id="inputEmail" name="email" placeholder="Email" required>
    </div>
  </div>

  <div class="row mb-3">
    <label for="inputGroup" class="col-sm-2 col-form-label">Grupo</label>
    <div class="col-sm-10">
      <select class="form-control" name="grupo">
        <option value="super_admin">Super Admin</option>
        <option value="admin">Admin</option>
        <option value="usuario">Usuário</option>
      </select>
    </div>
  </div>

  <div class="text-center">
    <button type="submit" class="btn btn-primary">Adicionar Usuário</button>
    <a href="{{ url_for('main.usuarios') }}" class="btn btn-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
