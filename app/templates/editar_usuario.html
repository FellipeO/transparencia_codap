{% extends 'base.html' %}

{% block title %}Editar Usuário{% endblock %}
{% block page_title %}Editar Usuário{% endblock %}
{% block breadcrumb %}Editar Usuário{% endblock %}

{% block content %}
<form action="{{ url_for('admin.editar_usuario', email=usuario.email) }}" method="post">
  <div class="row mb-3">
    <label for="inputEmail" class="col-sm-2 col-form-label">Email</label>
    <div class="col-sm-10">
      <input type="email" class="form-control" id="inputEmail" name="email" value="{{ usuario.email }}" readonly>
    </div>
  </div>

  <div class="row mb-3">
    <label for="inputGroup" class="col-sm-2 col-form-label">Grupo</label>
    <div class="col-sm-10">
      <select class="form-control" name="grupo">
        <option value="super_admin" {% if usuario.grupo == 'super_admin' %}selected{% endif %}>Super Admin</option>
        <option value="admin" {% if usuario.grupo == 'admin' %}selected{% endif %}>Admin</option>
        <option value="usuario" {% if usuario.grupo == 'usuario' %}selected{% endif %}>Usuário</option>
      </select>
    </div>
  </div>

  <div class="text-center">
    <button type="submit" class="btn btn-primary">Salvar Alterações</button>
    <button type="reset" class="btn btn-secondary">Resetar</button>
  </div>
</form>
{% endblock %}
